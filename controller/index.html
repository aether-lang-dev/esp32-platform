<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Device controller</title>
<script type="module" src="/assets/datastar.js"></script>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101719;color:#edf2ed}
*{box-sizing:border-box}body{margin:0}main{max-width:960px;margin:auto;padding:64px 28px}
header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #344441;padding-bottom:28px}
h1{font-size:30px;letter-spacing:-.8px;margin:0}h2{font-size:18px;font-weight:500}
small{color:#a9bbb3}button{background:#c5ebca;border:0;border-radius:6px;padding:12px 18px;font:inherit;cursor:pointer}
.status{display:flex;align-items:center;gap:10px}.dot{height:9px;width:9px;border-radius:50%;background:#89958e}
.dot.online{background:#95e9a6}.details{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:36px 0}
.details div{border:1px solid #344441;border-radius:8px;padding:20px}.details span{display:block;font:28px monospace;margin-top:14px}
#message{color:#e4bb8d;min-height:24px}footer{margin-top:48px;border-top:1px solid #344441;padding-top:20px;color:#a9bbb3}
@media(max-width:600px){main{padding:32px 18px}.details{grid-template-columns:1fr 1fr}header{gap:18px}h1{font-size:24px}}
</style>
</head>
<body data-signals='{"connected":false,"state":"Checking","active":0,"floor":0,"trial":0,"exit":0,"message":""}'
      data-init="@get('/status')">
<main>
<header><div><small>Local master controller</small><h1>Device console</h1></div><button data-on:click="@get('/status')">Refresh status</button></header>
<h2 class="status"><span class="dot" data-class:online="$connected"></span><span data-text="$connected ? 'S60 connected' : 'S60 disconnected'"></span></h2>
<p id="message" data-text="$message"></p>
<section class="details" aria-label="Installed application">
<div><small>Active release</small><span data-text="$connected ? 'v' + $active : '—'"></span></div>
<div><small>Replay floor</small><span data-text="$connected ? 'v' + $floor : '—'"></span></div>
<div><small>Runner state</small><span data-text="$connected ? $state : '—'"></span></div>
<div><small>Last exit code</small><span data-text="$connected ? $exit : '—'"></span></div>
</section>
<footer>Device connections use PSK TLS. The controller reads its key from a local file.</footer>
</main>
</body>
</html>
